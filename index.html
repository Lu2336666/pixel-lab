<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <script>
    (function () {
      const stop = (e) => e.preventDefault();
      document.addEventListener('gesturestart', stop, { passive: false, capture: true });
      document.addEventListener('gesturechange', stop, { passive: false, capture: true });
      document.addEventListener('gestureend', stop, { passive: false, capture: true });
      const pinch = (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); };
      document.addEventListener('touchstart', pinch, { passive: false, capture: true });
      document.addEventListener('touchmove', pinch, { passive: false, capture: true });
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#F2F2F7" />
  <title>像素风</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="paywall" id="paywall">
    <div class="pay-card">
      <div class="pay-mark" aria-hidden="true"></div>
      <h2>像素风</h2>
      <p class="pay-lead">一次买断，这台设备终身能用</p>
      <div class="price">¥2.88</div>
      <button type="button" class="primary pay-go" id="btnPay">支付宝支付 ¥2.88</button>
      <p class="pay-note">付完自动解锁。换手机可填终身凭证。</p>
      <button type="button" class="ghost" id="btnShowRestore">我已付款</button>
      <div class="restore-box hidden" id="restoreBox">
        <input id="restoreCode" type="text" inputmode="text" autocapitalize="characters" placeholder="PX-XXXX-XXXXXX" />
        <button type="button" class="primary" id="btnRestore">解锁</button>
      </div>
    </div>
  </div>
  <div class="app">
    <header class="top">
      <div class="titles">
        <div class="brand">像素风</div>
        <div class="sub" id="status">选一张图，按 MARD 221 出图纸</div>
      </div>
      <button type="button" class="ghost top-off" id="btnOffline">加到主屏</button>
    </header>

    <div class="lan hidden" id="lanBanner"></div>

    <div class="stage" id="stage">
      <canvas id="view"></canvas>
      <div class="empty" id="empty">
        <div class="px-mark" aria-hidden="true"></div>
        <p>点下面「相册」或「拍照」</p>
        <p class="hint">只用色卡里的颜色，格子上会标 A1、B12。图纸可双指缩放</p>
      </div>
    </div>

    <div class="panel">
      <div class="row size-row">
        <span class="lab">格子</span>
        <button type="button" class="tog on" id="btnAutoH" aria-pressed="true">高自动</button>
        <button type="button" class="tog" id="btnCrop">裁剪</button>
      </div>
      <div class="row sliders">
        <label>宽 <span id="gridWVal">32</span>
          <input id="gridW" type="range" min="8" max="200" value="32" />
        </label>
        <label>高 <span id="gridHVal">自动</span>
          <input id="gridH" type="range" min="8" max="200" value="32" />
        </label>
      </div>
      <div class="row sliders">
        <label>对比 <span id="conVal">1.10</span>
          <input id="contrast" type="range" min="80" max="180" value="110" />
        </label>
        <label>饱和 <span id="satVal">1.10</span>
          <input id="saturate" type="range" min="40" max="200" value="110" />
        </label>
      </div>
      <div class="toggles">
        <button type="button" class="tog" id="btnDither" aria-pressed="false">抖动</button>
        <button type="button" class="tog on" id="btnLabels" aria-pressed="true">色号</button>
      </div>
      <div class="legend-label">用到的色号</div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="bar">
      <button type="button" class="ghost" id="btnAlbum">相册</button>
      <button type="button" class="ghost" id="btnShot">拍照</button>
      <button type="button" class="primary" id="btnSave" disabled>保存</button>
      <button type="button" class="ghost" id="btnShare" disabled>分享</button>
    </div>
  </div>

  <input id="fileAlbum" type="file" accept="image/*" hidden />
  <input id="fileShot" type="file" accept="image/*" capture="environment" hidden />
  <div class="crop-layer hidden" id="cropLayer">
    <div class="crop-head">
      <span>裁剪画面</span>
      <button type="button" class="ghost" id="cropCancel">取消</button>
    </div>
    <div class="crop-stage" id="cropStage">
      <canvas id="cropCanvas"></canvas>
    </div>
    <div class="chips wrap" id="ratioChips"></div>
    <button type="button" class="primary crop-done" id="cropDone">用这块</button>
  </div>
  <div class="toast" id="toast"></div>
  <script src="pay-config.js"></script>
  <script src="pay.js"></script>
  <script src="mard221.js"></script>
  <script src="app.js"></script>
</body>
</html>
