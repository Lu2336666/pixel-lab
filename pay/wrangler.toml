name = "pixel-lab-pay"
main = "worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 部署后填真实 ID：npx wrangler kv namespace create LICENSES
# [[kv_namespaces]]
# binding = "LICENSES"
# id = "把 wrangler 打印的 id 贴这里"

[vars]
SITE_URL = "https://lu2336666.github.io/pixel-lab/"
ALIPAY_GATEWAY = "https://openapi.alipay.com/gateway.do"

# 密钥不要写进仓库，用：
# npx wrangler secret put ALIPAY_APP_ID
# npx wrangler secret put ALIPAY_PRIVATE_KEY
# npx wrangler secret put ALIPAY_PUBLIC_KEY
